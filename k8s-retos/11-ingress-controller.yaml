apiVersion: v1
kind: Namespace
metadata:
  name: ingress-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: campus-ingress
  namespace: ingress-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: campus-ingress
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, namespaces, pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: campus-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: campus-ingress
subjects:
  - kind: ServiceAccount
    name: campus-ingress
    namespace: ingress-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-ingress
  namespace: ingress-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: campus-ingress
  template:
    metadata:
      labels:
        app: campus-ingress
    spec:
      serviceAccountName: campus-ingress
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: campus-control-plane
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: traefik
          image: traefik:v3.6
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=campus
            - --entrypoints.web.address=:80
            - --api.dashboard=false
            - --accesslog=true
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
